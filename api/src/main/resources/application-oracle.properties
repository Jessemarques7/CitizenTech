# Perfil "oracle": usa o banco Oracle da FIAP.
# 1) Rode database/citizentech.sql no SQL Developer com o seu usuario (RM).
# 2) Defina as variaveis de ambiente ORACLE_USER e ORACLE_PASSWORD (e ORACLE_URL se for outro servidor).
# 3) mvn spring-boot:run -Dspring-boot.run.profiles=oracle
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521/ORCL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# As tabelas e a carga ja foram criadas pelo script; a API nao recria nada.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
