spring.application.name=citizentech-api
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Banco padrao: H2 em memoria, em MODO ORACLE, carregado com o MESMO modelo e
# a mesma carga de database/citizentech.sql (gerados por database/gerar_h2.py).
# Permite rodar a API sem credenciais. Para o Oracle da FIAP use o perfil "oracle".
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:citizentech;MODE=Oracle;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/h2/schema.sql
spring.sql.init.data-locations=classpath:db/h2/data.sql
spring.sql.init.encoding=UTF-8

# O schema vem do script SQL; o Hibernate nao cria nem altera tabelas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Erros: nunca expor stack trace / mensagens internas
server.error.include-stacktrace=never
server.error.include-message=never

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ---------------------------------------------------------------------------
# Seguranca. Em producao, defina as variaveis de ambiente (nunca commitar segredos).
# ---------------------------------------------------------------------------
citizentech.jwt.secret=${CITIZENTECH_JWT_SECRET:dev-only-troque-este-segredo-com-32-bytes-ou-mais}
citizentech.jwt.expiracao-minutos=120
citizentech.jwt.emissor=citizentech-api
citizentech.iot.device-key=${CITIZENTECH_DEVICE_KEY:sensor-demo-key-2026}
citizentech.iot.minutos-desatualizada=30
citizentech.login.max-tentativas=5
citizentech.login.bloqueio-minutos=15
# Origens liberadas no CORS (front web/demonstracao). O app Android nativo nao usa CORS.
citizentech.cors.allowed-origins=${CITIZENTECH_CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080}
